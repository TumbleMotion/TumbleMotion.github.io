<style>

<h1>HOLLOW ARBOR</h1>

<script>
const R={L:'Brig. Gen. W. H. Lindqvist, Director',V:'Dr. Ellen Vasko, Scientific Director',O:'Maj. T. Okafor, Security'};
const S={
start:{t:'THE FILE',m:'Halvorsen Ordnance Depot, Maryland · 1982–1985',h:`<p>This is a leaked copy of the file on HOLLOW ARBOR, a Special Access Program of the US Army’s Foreign Science Assessment Division, investigating ESP and remote viewing, run in the early 1980s.</p><p>The project was closed down. Everyone involved was reassigned or resigned, and at least one of them is understood to be confined to a psychiatric hospital.</p><p>Parts of the file have been blacked out. Tap any <span class="r" data-t="redaction">██████</span> to read what’s underneath.</p><p>Turn the lights down.</p>`,c:[['Open the file ▸','d1']]},
d1:{r:'L',t:'DOCUMENT 1 · DIRECTIVE',m:'14 Sep 1982 · Lindqvist to Lt. Col. R. Doyle',h:`<p>1. Recent assessments indicate that Soviet institutes continue to fund research into so-called “psychotronic” phenomena, including remote perception and mental influence on physical systems. This Division does not assess these claims as credible. This Division also cannot afford to be wrong about them.</p><p>2. You are directed to establish a small, discreet research effort at Building 9, Halvorsen Ordnance Depot, to evaluate the operational utility of remote perception and to characterize any measurable physical effects associated with gifted subjects.</p><p>3. FY83 funding of $1.4 million is authorized, staffing not to exceed fourteen. The effort will be described as a “sensory perception study.” The terms “<span class="r" data-t="psychic">███████</span>,” “<span class="r" data-t="paranormal">██████████</span>” and “<span class="r" data-t="occult">██████</span>” are prohibited.</p><p>4. Dr. Ellen Vasko is appointed Scientific Director.</p><p class="note">Ray, keep it dull. Dull is invisible. — WHL</p>`,c:[['Continue ▸','d2']]},
d2:{r:'L',t:'DOCUMENT 2 · INTERIM SUMMARY',m:'22 Mar 1983 · Dr. E. Vasko to Lt. Col. Doyle',h:`<p>1. Phase I comprised 212 trials across nine subjects. The hit rate was 11.3 percent against a chance expectation of 10 percent. Phase I has produced no operationally useful remote perception.</p><p>2. I must nonetheless draw attention to an unrelated finding. Structural accelerometers installed in Building 9 for a vibration survey, and never removed, show repeated low-amplitude events synchronous with sessions in which Subjects 6 and 7 are present together. The dominant frequency is approximately 7 Hz. No such events occur with either subject alone, or with any other pairing.</p><p>3. Concurrent with these events, observers report rapping from the walls, a temperature drop of up to 6°C, and displaced objects. On 9 March a steel filing cabinet in Room 3 was found <span class="r" data-t="1.2 metres from its marked position">████████████████████████████</span>. The floor is level. The cabinet was empty and unlocked. The wall clock in Room 3 also runs eleven minutes slow; it has been replaced twice, and the replacement runs slow too. Facilities attributes this to a faulty batch.</p><p>4. I am aware of how this reads. I will state only that the data are reproducible in four of six sessions, and that I cannot attribute them to the subjects.</p>`,c:[['Continue ▸','d3']]},
d3:{r:'L',t:'DOCUMENT 3 · AUDIT BRANCH, THEN TELETYPE',m:'29 Mar and 4 Apr 1983 · J. A. Kessler; DIR FSAD',h:`<p>1. Phase I cost $1,412,300 and produced no usable intelligence. This Branch recommends termination.</p><p>2. The Scientific Director’s summary refers to “events” in the facility. This Branch notes requisitions for four accelerometers, three reel-to-reel recorders, and “one (1) thermometer array, wall-mounted.” Justification is requested.</p><p>3. Page 3 of the Director’s draft contains the word “<span class="r" data-t="poltergeist">██████████</span>,” in quotation marks. The Branch requests that it not appear in any document the Appropriations Committee may see.</p><p>4. This Branch further notes that eleven mugs have been broken in Room 3 since January, and that no other room has lost more than one. Facilities has requested more mugs. The request is denied.</p><p><b>TELETYPE, 041420Z APR 83.</b> FUNDING CONTINGENT ON REPEATABILITY UNDER CONTROLLED CONDITIONS. EVENTS ARE HEREAFTER DESIGNATED UNATTRIBUTED ENVIRONMENTAL EVENTS (UEE). NO OTHER TERM IS TO BE USED IN WRITING. LINDQVIST.</p>`,c:[['Continue ▸','d4']]},
d4:{r:'L',t:'DOCUMENT 4 · PHASE II FINDINGS',m:'12 Dec 1983 · Drs. Vasko and Pruitt',h:`<p>1. UEEs recurred in 31 of 40 sessions. On six occasions they continued overnight with no personnel in the building, but only on nights following sessions in which commercially procured hemispheric-synchronization audio tapes had been played. They are therefore not a function of the subjects’ presence alone. The tapes open with a twelve-pulse count-in at 7 Hz before the tone settles.</p><p>2. The rapping is not random. At least three distinct cadences, A, B and C, recur across sessions. A is slow and regular, about one rap every four seconds. B is moderate, in groups of three. C is rapid and irregular, and has never repeated exactly. This is difficult to reconcile with a single source.</p><p>3. On 17 November Dr. Pruitt rapped three-two-one on the wall of Room 3 as a test. <b>Cadence B returned three-two-one.</b> It has since done so on request four further times. Cadences A and C have never responded to any test.</p><p>4. Working hypothesis: the subjects’ combined 7 Hz pattern, reinforced by the audio, functions as a carrier signal. The UEEs appear to be a response to the carrier, not a product of it.</p><p>5. Housekeeping: two reel-to-reel tapes made overnight in the empty building run four minutes longer than the periods they cover. Dr. Pruitt attributes this to a faulty capstan.</p><p>6. I do not know what is responding, but I do know that it is responding.</p>`,c:[['Continue ▸','p3']]},
p3:{r:'L',t:'DOCUMENT 5 · REQUEST TO INITIATE PHASE III',m:'8 Aug 1984 · Lt. Col. Doyle to Lindqvist',h:`<p>1. Phase III will attempt to induce UEEs on demand by sustained 7 Hz entrainment of Subjects 6 and 7 in Room 3, with the building’s public-address speakers added for acoustic coupling. The objective is to characterize the phenomenon at full amplitude rather than at its margins.</p><p>2. Safeguards: medical officer on station; main breaker under Facilities Engineering control; any session reaching Level 3 (damage or injury) terminated at once.</p><p><b>SECURITY — NON-CONCUR (Maj. Okafor).</b> Phase II established that the phenomenon answers when called. Phase III proposes to call it louder, inside a closed structure, with no knowledge of whether it can be told to stop. Everyone involved has asked what it does when invited. No one has asked what it does if it stays.</p><p>The decision is yours.</p>`,c:[['Approve Phase III, with the safeguards listed','s1'],['Deny. Close the project quietly.','e1']]},
e1:{end:1,t:'TERMINATION NOTICE',m:'30 Sep 1984',h:`<p>HOLLOW ARBOR is terminated. Records are filed, Dr. Vasko is reassigned, and Building 9 reverts to storage.</p><p>In the 1998 inventory a clerk notes that the filing cabinet in Room 3 is repeatedly found away from its mark, and that staff have stopped keeping anything in there. Nobody has rapped on that wall since 1984.</p><p>Dull is invisible. So, it turns out, is a question nobody asks.</p>`},
s1:{r:'V',t:'DOCUMENT 6 · SESSION 14, PART ONE',m:'11 Jan 1985 · Room 3 · Present: Vasko, Pruitt, Okafor, Nwosu (MC), Boyle (Facilities), Spc. Merrick, Subjects 6 and 7',h:`<ol class="log"><li><b>19:12</b>Entrainment audio begins. Subjects seated.</li><li><b>19:21</b>Room 3 cools from 19°C to 16°C.</li><li><b>19:26</b>Rapping, Cadence A. Consistent with Phase II.</li><li><b>19:31</b>Cadence B joins. Then Cadence C. First time all three have been recorded together.</li><li><b>19:34</b>Level 1. Within protocol. Dr. Pruitt: <i>three more minutes at this amplitude and we have the characterization we came for.</i></li></ol><p>Accelerometers show the 7 Hz is no longer confined to Room 3. You can feel it in the floor.</p>`,c:[['Order the audio cut now','e2'],['Let it run. Pruitt wants three more minutes.','s2']]},
e2:{end:1,t:'INCIDENT REPORT · SESSION 14',m:'11 Jan 1985, 19:32',h:`<p>Pruitt cuts the audio. Over eleven minutes the 7 Hz in the structure decays and the three cadences fall silent, one by one. The cabinet stays where it is. Okafor logs a Level 1 event and Phase III is cancelled. Building 9 is locked and the records are classified.</p><p>Pruitt keeps one strip-chart for himself. The decay was not smooth. It stepped down in twelve equal pulses, as if something were counting.</p><p class="note">Counting what, he never says.</p>`},
s2:{r:'V',t:'DOCUMENT 6 · SESSION 14, PART TWO',m:'11 Jan 1985 · continued',h:`<ol class="log"><li><b>19:38</b>7 Hz throughout the structure. Basement and roof sensors active. NOT localized to Room 3.</li><li><b>19:39</b>Observation room 11°C. Breath visible.</li><li><b>19:40</b>Vasko requests termination. Audio cut. Accelerometers still report 7 Hz.</li><li><b>19:41</b>Subject 7 non-responsive. Capt. Nwosu attending.</li><li><b>19:43</b>An empty steel cabinet travels the length of the corridor, about thirty metres, and strikes the far wall. No personnel involved.</li><li><b>19:44</b>LEVEL 3. Boyle throws the main breaker. All lights out. 7 Hz continues on de-energized circuits. Disconnected telephones ringing.</li><li><b>19:52</b>Stairwell B door fails to open for four minutes. Pruitt and Merrick injured forcing it. It then opens without assistance.</li><li><b>20:03</b>Okafor and Nwosu retrieve both subjects from Room 3. Building cleared 20:10.</li></ol>`,c:[['Continue ▸','m']]},
m:{r:'O',t:'DOCUMENT 7 · MEDICAL REPORT',m:'14 Jan 1985 · Capt. A. Nwosu, M.C.',h:`<p>1. Dr. Pruitt: fractured wrist, concussion. Spc. Merrick: lacerations to both hands. Both recovering.</p><p>2. Subject 6: shaken, uninjured, no recollection of 19:38 to 20:03.</p><p>3. Subject 7: non-responsive for 31 hours. EEG normal apart from a persistent 7 Hz rhythm that did not diminish under sedation. On waking: “It isn’t in the room anymore. It’s in the walls. There are more of them than there were.” Subject asked that the building not be re-entered.</p><p>4. I have no medical explanation to offer, and I decline to speculate beyond my competence.</p>`,c:[['Continue ▸','b']]},
b:{r:'O',t:'DOCUMENT 8 · BOARD OF INQUIRY',m:'4 Feb 1985 · Findings',h:`<p>1. A three-person re-entry team went in on 17 January and was withdrawn after eleven minutes. Corridor temperature minus 9°C. All instruments registered 7 Hz. One member reported a tap on the shoulder. <span class="r" data-t="No one was behind him.">████████████████</span></p><p>2. Dr. Vasko, in testimony: <i>“In Session 14 we amplified and sustained the signal inside a closed structure. I do not believe we produced the phenomenon. I believe we invited it, and that it no longer requires us to keep sending the invitation.”</i></p><p>3. UEEs have not been observed beyond the structure’s perimeter. Data are limited.</p><p>The Board asks for Security’s recommendation. You are the one who warned them.</p>`,c:[['Seal Building 9 in place','e3'],['Demolish it and haul the rubble away','e4']]},
e3:{end:1,t:'SEALING AND TERMINATION',m:'Mar 1985',h:`<p>Doors, windows and ducts are filled with poured concrete; the roof is capped with a 30 cm slab. The public line is asbestos and structural deterioration. Formwork on the north wall is knocked loose on three consecutive mornings, then re-secured with steel.</p><p>HOLLOW ARBOR is terminated, the records classified for 75 years. Dr. Vasko resigns, asking only that it be recorded that <b>sealing a thing is not the same as closing it.</b></p><p>The perimeter sensors read nil for years. In November 1990 an inspector hears rapping at the north wall. Three cadences. Then, in March 1991, a twelve-pulse sequence.</p>`,c:[['Continue ▸','i1']],p:'sealed'},
e4:{end:1,t:'DEMOLITION AFTER-ACTION',m:'22 Mar 1985 onward',h:`<p>The wrecking crew reports cold spots and a foreman who refuses to go back in. The rubble goes to a landfill forty miles away. By autumn there is rapping in the depot motor pool, then the guardhouse, then a farmhouse on Route 9.</p><p><b>STATEMENTS TAKEN BY SECURITY, OCT–NOV 1985 (extracts)</b></p><p>Pfc. D. Albrecht, motor pool: “The toolbox lids went first, they'd just rattle. Then every socket in bay 3 failed. Object would move when no one was looking, <span class='r' data-t='loads of broken mugs too.'>█████████████████████</span>”</p><p>Mrs. E. Voss, Route 9: “By morning every chair in the kitchen was on top of one another. <span class='r' data-t='There was a knocking too, coming from the walls.'>██████████████████████</span>”</p><p>Sgt. L. Greer, guardhouse: “That phone was disconnected in March. It rang for two minutes before I picked it up. <span class='r' data-t='There was a knocking sound, and a kind of pulse.'>████████████████████</span>”</p><p>Your December memo says the Board could not justify assumptions about its behavior, and that you then made one: that it was confined to the building.</p><p class="note">It was not confined to the building.</p>`,c:[['Continue ▸','i1']],p:'dispersal'}
};
Object.assign(R,{I:'the quarterly perimeter inspector, Halvorsen'});
Object.assign(S,{
i1:{r:'I',t:'BRIEFING PACKAGE',m:'18 Nov 1992 · Halvorsen Ordnance Depot',h:()=>`<p>${PATH==='sealed'?'Building 9 has been sealed for seven years. The north-wall sensors have read nil since June.':'Building 9 no longer exists. Security keeps a list of fourteen places on the depot where it has been heard. You walk the list each quarter.'}</p><p>This morning a sealed envelope arrives from the Division: a liaison memorandum from London, and a contingency plan stamped READ BEFORE INSPECTION.</p>`,c:[['Read the memorandum ▸','i2']]},
i2:{r:'I',t:'LIAISON MEMORANDUM · UNITED KINGDOM',m:'12 Nov 1992 · Defence Intelligence liaison, London, to FSAD',h:`<p>1. On the night of 31 October a national broadcaster aired a live Halloween programme, GHOSTWATCH, presented as a factual investigation of a haunted house. It was fiction. In its closing minutes the presenters announced that they had accidentally created a mass séance from the people watching at home. Our analysts have classified the broadcast as a cognitive hazard: material whose being watched is itself the means of harm. They believe the distinction between fiction and fact ceased to matter at 22:14 hours.</p><p>2. By 06:00 on 1 November, police forces had logged 11,400 calls. Exchanges in <span class='r' data-t='Birmingham, Leeds and Glasgow'>██████████████</span> failed under load. Nobody had asked the viewers to do anything. They had only watched. It appears to have been sufficient.</p><p>3. Witness accounts (extracts):</p><p>Ms. R., Leeds: “The kettle slid off the worktop. Not fell. Slid. Then every cupboard opened at once, and <span class='r' data-t='knocking came from inside the walls.'>████████████████</span>”</p><p>Mr. T., Coventry: “My son’s furniture was stacked against his bedroom door from the inside. <span class='r' data-t='He was in the garden with me.'>███████████████</span>”</p><p>PC H., Kent: “My glass dining table suddenly exploded, shattering completely. My husband severely cut his face and hands <span class='r' data-t='leaving blood all over the walls.'>████████████████</span>”</p><p>4. The disturbances died down after forty-eight hours. Cause unknown. Our analysts have put forward one hypothesis, which we stress is unconfirmed: that the broadcast created a temporarily synchronised audience, and that once the programme ended and viewers stopped collectively anticipating a response, the connection weakened.</p><p>5. Our analysts note that the cadence documented by your Project in 1983 match the knocking logged in all affected areas. We are not asking how we know that.</p><p>6. The official explanation is mass psychosis. HMG concurs. Please do not contradict it.</p><p>7. For your information only: police call logs for the night were collected from every force by courier on 4 November, and a DA-Notice was issued to editors. The studio has been closed and sealed pending a “structural survey.” <span class='r' data-t='The presenter who was in it at the time has not been located.'>██████████████████████████████</span></p><p>8. We offer three lessons: do not name it, do not gather an audience, and treat knocking in pipework as a warning. These are the only measures that appeared to work. We cannot say why.</p><p>9. We closed a studio. We recommend you close your building. We are not confident that either will hold.</p><p><b>ANNEX A — ENTITY ASSESSMENT (UK DESIGNATION: “PIPES”)</b></p><p>A. The name was given by the children of the household where the broadcast was staged, after knocking in the plumbing that their mother first put down to the pipes. It was then used on air. By the following morning it was in use in every affected home. This is judged to be significant.</p><p>B. Precursors, in order of appearance: knocking attributed to plumbing; small objects displaced, scratches on a member of the household; a member of the household speaking in a voice not their own. <span class='r' data-t='A member of the studio team spoke in that voice, on air.'>██████████████████████████████</span></p><p>D. This is the last document in which it will be named.</p>`,c:[['Read the contingency plan ▸','i3']]},
i3:{r:'I',t:'CONTINGENCY PLAN WHITE LATCH',m:'Rev. 3 · Foreign Science Assessment Division',h:`<p>Purpose: to limit the spread of a UEE outbreak from a known source.</p><p>1. <b>QUIET.</b> No personnel will answer a rapping, tapping or any rhythmic sound. A cadence is a question. Do not answer it.</p><p>2. <b>NO CARRIERS.</b> Entrainment audio, metronomes and sustained tones near 7 Hz are prohibited within one mile of any source. Subjects 6 and 7 will be kept apart. <span class='r' data-t='Subject 7 requested this.'>███████████████</span></p><p>3. <b>NO AUDIENCE.</b> Gatherings, broadcasts and group vigils in an affected area are to be discouraged by any means available. Expectation functions as an invitation.</p><p>4. <b>NO TELEPHONES.</b> Telephone and PA systems in an affected building are to be disconnected at the exchange, not the handset.</p><p>5. <b>COVER.</b> Reports are to be attributed to ground subsidence, ventilation infrasound or mass suggestion, in that order.</p><p>6. <b>ESCALATION.</b> An inspector who reports a response to a knock is to be <span class='r' data-t='reassigned the same day and not permitted to return'>█████████████████████</span>.</p><p>7. <b>NO NAMES.</b> Do not name it, and do not allow it to be named. A name is a handle, and it travels by telephone, print and broadcast.</p><p>8. <b>PLUMBING.</b> Knocking in pipework is to be treated as a precursor, not a fault. Do not call a plumber.</p>`,c:[['Begin your inspection ▸','i4']]},
i4:{r:'I',t:'PERIMETER INSPECTION',q:'▒▒ LOG ENTRY SMUDGED IN COPYING — WHICH WAS RECORDED?',m:'18 Nov 1992 · Quarterly',h:()=>`<p>${PATH==='sealed'?'You stand at the north wall of Building 9. The concrete is cold and slightly damp; seven years of rain have not marked it. The sensors read nil.':'You are in motor pool bay 3, location nine on the list. The sensors read nil. A toolbox lid beside you is vibrating against its latch, too fast to count. You feel it in your chest more than you hear it.'}</p><p>Your knuckles are inches from the nearest surface.</p>`,c:[['Follow WHITE LATCH. Log it.','x1'],['Rap three-two-one, “to see”','x2']]},
x1:{end:1,t:'INSPECTION LOG',m:'18 Nov 1992',h:`<p>You write: PERIMETER INTACT. NO RESPONSE. You do not answer.</p><p>Walking back to the car you hear it behind you, at a polite interval: three, two, one. You keep walking. The guardhouse phone is ringing. The guard is looking at it. “It’s been doing that for days,” he says. The line was cut at the exchange in 1985.</p><p><span class='r' data-t='He has not answered it either. Neither of you says why.'>████████████████████</span></p>`},
x2:{end:1,t:'SESSION 15',m:'18 Nov 1992',h:`<p>You rap three, two, one.</p><p>For eleven seconds, nothing. Then, from inches away, three. Two. One. Then a twelve-pulse sequence you read about this morning.</p><p>Your radio, switched off, begins to hum at seven cycles per second. Everyone on the depot who has ever waited for something to answer them stops what they are doing.</p><p class='big'>SESSION 15 COMMENCED.</p>`}
});

c.innerHTML=`<header><b>${s.t}</b><span>${s.m}</span></header>${typeof s.h==='function'?s.h():s.h}<div class="ch">${s.c&&s.c.length>1?`<p class="q">${s.q||'▒▒ ENTRY OBSCURED IN COPYING — WHICH WAS RECORDED?'}</p>`:''}</div>`;
const ch=c.querySelector('.ch');
(s.c||[['Start again ▸','start']]).forEach(([l,to],i,a)=>{const b=document.createElement('button');b.textContent=(a.length>1?String.fromCharCode(65+i)+'. ':'')+l;if(s.end)b.className='alt';b.onclick=()=>{if(a.length>1)play('stamp');ch.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('pick');if(to==='start'){$('#docs').innerHTML='';if(DR){DR.pause();DR=null}}go(to)};ch.appendChild(b)});

}
